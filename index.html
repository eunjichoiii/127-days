<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1f3d">
  <title>Happy birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud" hidden>
      <div class="hud-row">
        <span id="hudChapter" class="hud-chapter">CH 01</span>
        <span id="hudTitle" class="hud-title"></span>
        <span id="hudCount" class="hud-count"></span>
      </div>
      <div class="hud-bar" aria-hidden="true"><div id="hudFill" class="hud-fill"></div></div>
      <ol id="hudDots" class="hud-dots" aria-hidden="true"></ol>
    </header>

    <main id="stage" aria-live="polite"></main>

    <footer id="actions" hidden>
      <button id="prevBtn" class="btn-prev" type="button">← 이전</button>
      <button id="nextBtn" class="btn-next" type="button">다음</button>
    </footer>
  </div>

  <div id="curtain" aria-hidden="true"><span id="curtainText"></span></div>

  <div id="ppong" aria-hidden="true">
    <div id="ppongBubble" class="ppong-bubble"></div>
    <div id="ppongFace" class="ppong-face"></div>
  </div>

  <div id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="닫기">×</button>
    <button class="lb-prev" type="button" aria-label="이전 사진">‹</button>
    <div class="lb-body"></div>
    <button class="lb-next" type="button" aria-label="다음 사진">›</button>
  </div>

  <div id="fx" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
